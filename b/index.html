<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LeadBound | Outbound for funded B2B tech startups</title>
<meta name="description" content="">
<link rel="icon" href="../shared/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF2F3; --sheet:#F7FAFA; --ink:#0B1B22; --soft:#4A5F69; --dim:#7A8D95; --line:#CFDADE;
  --cyan:#12B7D4; --cyan-d:#07788E; --night:#06090D;
  --serif:"Frank Ruhl Libre",Georgia,serif; --sans:"Assistant",system-ui,sans-serif;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block} a{color:inherit}
p{margin:0} h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.015em}
html[lang=he] h1,html[lang=he] h2,html[lang=he] h3{letter-spacing:0;line-height:1.15}
:focus-visible{outline:2px solid var(--cyan-d);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:24px}
.narrow{max-width:760px;margin-inline:auto;padding-inline:24px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:999px;font-size:16px;transition:background .2s}
.btn:hover{background:var(--cyan-d)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)} .btn.line:hover{background:var(--ink);color:#fff}
.lang{background:none;border:0;color:var(--soft);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.lang:hover{color:var(--ink)}

header{padding:26px 0}
header .wrap{display:flex;align-items:center;gap:28px}
header img{height:21px;width:auto}
header nav{display:flex;gap:24px;margin-inline-start:auto;font-size:15px;color:var(--soft)}
header nav a{text-decoration:none} header nav a:hover{color:var(--ink)}
header .btn{padding:10px 18px;font-size:15px}
@media (max-width:860px){header nav{display:none}header .lang{margin-inline-start:auto}}

/* hero: the letter */
.hero{padding:72px 0 40px;text-align:center}
.hero h1{font-size:clamp(44px,7vw,100px);font-weight:500;max-width:14ch;margin-inline:auto}
html[lang=he] .hero h1{font-size:clamp(40px,6vw,84px);max-width:15ch}
.hero .sub{margin:30px auto 0;max-width:40ch;font-size:21px;color:var(--soft)}
.hero .sign{margin-top:18px;font-family:var(--serif);font-style:italic;color:var(--dim);font-size:17px}
html[lang=he] .hero .sign{font-style:normal}
.hero .ctas{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero .for{margin-top:18px;color:var(--dim);font-size:15px}

/* the calendar: signature moment */
.cal{margin:72px auto 0;max-width:980px}
.cal h2{font-size:26px;text-align:center}
.cal .note{text-align:center;margin-top:8px;color:var(--dim);font-size:14px}
.sheet{margin-top:28px;background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 1px 0 #fff inset,0 30px 60px -40px rgba(11,27,34,.35)}
.crow{display:grid;grid-template-columns:110px repeat(5,1fr);gap:8px;align-items:stretch}
.crow + .crow{margin-top:8px}
.crow.head div{font-size:13px;color:var(--dim);text-align:center}
.crow .wk{font-size:14px;color:var(--soft);display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.crow .wk small{font-size:12px;color:var(--dim)}
.cell{min-height:54px;border-radius:10px;background:#fff;border:1px solid #E3EAEC;position:relative;overflow:hidden}
.mt{position:absolute;inset:6px;border-radius:7px;background:var(--cyan);color:#032027;font-size:12px;font-weight:600;padding:6px 8px;line-height:1.2;opacity:0;transform:scale(.92);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1)}
.mt span{display:block;font-weight:400;opacity:.8}
.crow.on .mt{opacity:1;transform:none}
.crow.setup .cell{background:repeating-linear-gradient(135deg,#fff 0 8px,#F1F5F6 8px 16px)}
.phase{grid-column:2/-1;align-self:center;font-size:13px;color:var(--dim);padding-inline-start:4px}
@media (prefers-reduced-motion:reduce){.mt{opacity:1;transform:none;transition:none}}
@media (max-width:640px){.sheet{padding:12px}.crow{grid-template-columns:52px repeat(5,1fr);gap:5px}.crow .wk small{display:none}.cell{min-height:40px}.mt{inset:4px;padding:4px;font-size:10px}.mt span{display:none}}

.logos{padding:72px 0 24px;text-align:center}
.logos p{font-size:15px;color:var(--dim)}
.logos .row{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px 46px}
.logos img{height:26px;width:auto;filter:brightness(0);opacity:.7}
.logos img.tall{height:40px}
.logos .wm{font-family:var(--sans);font-weight:700;font-size:21px;opacity:.7}

section{padding:110px 0}
.kick{font-family:var(--serif);font-size:clamp(34px,4.6vw,58px)}

/* why: prose, not cards */
.why .narrow > p{margin-top:28px;font-size:20px;color:var(--soft)}
.why .narrow > p b{color:var(--ink);font-weight:600}

/* how: numbered vertical */
.how{background:var(--sheet);border-block:1px solid var(--line)}
.how ol{list-style:none;margin:48px 0 0;padding:0;display:grid;gap:0}
.how li{display:grid;grid-template-columns:90px 1fr;gap:20px;padding:28px 0;border-top:1px solid var(--line)}
.how li:last-child{border-bottom:1px solid var(--line)}
.how .num{font-family:var(--serif);font-size:54px;line-height:1;color:var(--cyan-d)}
.how h3{font-size:25px} .how p{margin-top:8px;color:var(--soft)}
@media (max-width:600px){.how li{grid-template-columns:52px 1fr}.how .num{font-size:38px}}

.stats{padding:70px 0}
.stats .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 56px}
.stat{text-align:center}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:46px;line-height:1}
html[dir=rtl] .stat b{direction:ltr}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--soft)}

/* packages: a staircase */
.stairs{margin-top:52px;display:grid;gap:18px}
.step{display:grid;grid-template-columns:200px 1fr auto;gap:30px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 32px}
.step:nth-child(2){margin-inline-start:6%} .step:nth-child(3){margin-inline-start:12%}
.step .lbl{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:18px}
html[lang=he] .step .lbl{font-style:normal}
.step h3{font-size:30px;margin-top:2px}
.step .tag{margin-top:8px;color:var(--soft);font-size:16px}
.step ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:16px}
.step li{padding-inline-start:22px;position:relative}
.step li::before{content:"";position:absolute;inset-inline-start:0;top:11px;width:10px;height:2px;background:var(--cyan)}
.step .best{margin-top:14px;font-size:14px;color:var(--dim)}
.step.first{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.first .tag,.step.first .best,.step.first .lbl{color:#A7BAC2}
.step.first .btn{background:var(--cyan);color:#032027}
.pknote{margin-top:20px;color:var(--dim);font-size:15px}
@media (max-width:860px){.step{grid-template-columns:1fr;gap:16px;padding:24px;margin-inline-start:0!important}}

/* proof */
.proof .quote{font-family:var(--serif);font-size:clamp(26px,3.2vw,40px);line-height:1.3;margin-top:36px}
.proof .who{margin-top:26px;display:flex;align-items:center;gap:14px}
.proof .who img{width:54px;height:54px;border-radius:50%}
.proof .who b{display:block} .proof .who span{color:var(--soft);font-size:15px}
.proof .nums{margin-top:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--line);padding-top:30px}
.proof .nums b{display:block;font-family:var(--serif);font-weight:500;font-size:44px;line-height:1}
html[dir=rtl] .proof .nums b{direction:ltr;text-align:right}
.proof .nums span{display:block;margin-top:8px;color:var(--soft);font-size:15px}
.proof .nums .sc{border-inline-start:1px solid var(--line);padding-inline-start:20px}
.proof .nums .sc i{font-style:normal;font-weight:700;display:block;margin-bottom:6px}
@media (max-width:760px){.proof .nums{grid-template-columns:1fr 1fr}.proof .nums .sc{border:0;padding:0}}

.cards{margin-top:40px;columns:3 300px;column-gap:16px}
.card{break-inside:avoid;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card .tag{font-size:13px;font-weight:700;color:var(--cyan-d)}
.card p{margin-top:8px;direction:ltr;text-align:left;font-family:var(--serif);font-size:18px;line-height:1.45}

.team .row{margin-top:40px;display:flex;gap:28px;flex-wrap:wrap}
.person{display:flex;gap:18px;align-items:center;flex:1 1 320px}
.person .ph{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#fff;flex:none}
.person .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.person b{font-size:20px;font-family:var(--serif);font-weight:500} .person p{margin-top:4px;color:var(--soft);font-size:16px}

.fit .row{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.fit h3{font-size:24px}
.fit ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.fit li{padding-inline-start:28px;position:relative}
.fit .yes li::before{content:"";position:absolute;inset-inline-start:0;top:9px;width:14px;height:14px;border-radius:50%;background:var(--cyan)}
.fit .no li{color:var(--soft)} .fit .no li::before{content:"";position:absolute;inset-inline-start:2px;top:15px;width:10px;height:1.5px;background:var(--dim)}
@media (max-width:700px){.fit .row{grid-template-columns:1fr}}

.faq details{border-bottom:1px solid var(--line)} .faq .list{margin-top:36px;border-top:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:22px 0;font-family:var(--serif);font-size:23px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--cyan-d);font-family:var(--sans)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding-bottom:22px;color:var(--soft);max-width:62ch}

.close{background:var(--night);color:#EAF0F3;text-align:center;padding:130px 0}
.close h2{font-size:clamp(40px,6vw,80px)}
.close p{margin:20px auto 0;max-width:44ch;color:#93A6B2}
.close .btn{margin-top:34px;background:var(--cyan);color:#032027}
footer{background:var(--night);color:#5F7381;font-size:14px;padding:0 0 34px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid #1C2833;padding-top:26px}
footer img{height:17px;width:auto;opacity:.8}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="../shared/assets/logo-black.png" alt="LeadBound">
  <nav><a href="#how" data-t="nav.how"></a><a href="#packages" data-t="nav.packages"></a><a href="#results" data-t="nav.results"></a><a href="#faq" data-t="nav.faq"></a></nav>
  <button class="lang" data-lang-toggle data-t="lang.toggle"></button>
  <a class="btn" data-book data-t="cta.short"></a>
</div></header>

<main>
<section class="hero" style="padding-bottom:0">
  <div class="wrap">
    <h1 data-t="b.hero.title"></h1>
    <p class="sub" data-t="b.hero.sub"></p>
    <p class="sign" data-t="b.letter.sign"></p>
    <div class="ctas"><a class="btn" data-book data-t="cta.book"></a><a class="btn line" href="#packages" data-t="nav.packages"></a></div>
    <p class="for" data-t="hero.for"></p>
  </div>
  <div class="wrap">
    <div class="cal">
      <h2 data-t="b.cal.title"></h2>
      <p class="note" data-t="b.cal.note"></p>
      <div class="sheet" id="sheet" aria-hidden="true"></div>
    </div>
  </div>
</section>

<div class="logos"><div class="wrap">
  <p data-t="logos.label"></p>
  <div class="row">
    <img src="../shared/assets/agentic-dark.svg" alt="Agentic-Dev">
    <img src="../shared/assets/controla.webp" alt="Controla">
    <span class="wm">Scoutech</span>
    <img src="../shared/assets/deeplan.webp" alt="Deeplan">
    <span class="wm">Brightmerge</span>
    <img class="tall" src="../shared/assets/falconies.webp" alt="Falconies">
    <span class="wm">Dex World</span>
  </div>
</div></div>

<section class="why"><div class="narrow">
  <h2 class="kick" data-t="why.title"></h2>
  <p><b data-t="why.1.t"></b>. <span data-t="why.1.b"></span></p>
  <p><b data-t="why.2.t"></b>. <span data-t="why.2.b"></span></p>
  <p><b data-t="why.3.t"></b>. <span data-t="why.3.b"></span></p>
</div></section>

<section class="how" id="how"><div class="narrow">
  <h2 class="kick" data-t="b.how.title"></h2>
  <ol>
    <li><div class="num">1</div><div><h3 data-t="how.1.t"></h3><p data-t="how.1.b"></p></div></li>
    <li><div class="num">2</div><div><h3 data-t="how.2.t"></h3><p data-t="how.2.b"></p></div></li>
    <li><div class="num">3</div><div><h3 data-t="how.3.t"></h3><p data-t="how.3.b"></p></div></li>
    <li><div class="num">4</div><div><h3 data-t="how.4.t"></h3><p data-t="how.4.b"></p></div></li>
    <li><div class="num">5</div><div><h3 data-t="how.5.t"></h3><p data-t="how.5.b"></p></div></li>
  </ol>
</div></section>

<div class="stats"><div class="wrap">
  <div class="stat"><b data-t="stat.1.n"></b><span data-t="stat.1.l"></span></div>
  <div class="stat"><b data-t="stat.2.n"></b><span data-t="stat.2.l"></span></div>
  <div class="stat"><b data-t="stat.3.n"></b><span data-t="stat.3.l"></span></div>
  <div class="stat"><b data-t="stat.4.n"></b><span data-t="stat.4.l"></span></div>
  <div class="stat"><b data-t="stat.5.n"></b><span data-t="stat.5.l"></span></div>
</div></div>

<section class="packages" id="packages" style="padding-top:60px"><div class="wrap">
  <h2 class="kick" data-t="pk.title"></h2>
  <p style="margin-top:14px;color:var(--soft);max-width:56ch" data-t="pk.sub"></p>
  <div class="stairs">
    <div class="step first">
      <div><div class="lbl" data-t="b.pk.step.1"></div><h3 data-t="pk.1.name"></h3><p class="tag" data-t="pk.1.tag"></p></div>
      <div><ul data-t-list="pk.1.items"></ul><p class="best" data-t="pk.1.best"></p></div>
      <a class="btn" data-book data-t="cta.short"></a>
    </div>
    <div class="step">
      <div><div class="lbl" data-t="b.pk.step.2"></div><h3 data-t="pk.2.name"></h3><p class="tag" data-t="pk.2.tag"></p></div>
      <div><ul data-t-list="pk.2.items"></ul><p class="best" data-t="pk.2.best"></p></div>
      <a class="btn line" data-book data-t="cta.short"></a>
    </div>
    <div class="step">
      <div><div class="lbl" data-t="b.pk.step.3"></div><h3 data-t="pk.3.name"></h3><p class="tag" data-t="pk.3.tag"></p></div>
      <div><ul data-t-list="pk.3.items"></ul><p class="best" data-t="pk.3.best"></p></div>
      <a class="btn line" data-book data-t="cta.short"></a>
    </div>
  </div>
  <p class="pknote" data-t="pk.note"></p>
</div></section>

<section class="proof" id="results"><div class="wrap">
  <h2 class="kick" data-t="case.title"></h2>
  <p class="quote" data-t="case.1.quote"></p>
  <div class="who"><img src="../shared/assets/elad.webp" alt=""><div><b data-t="case.1.name"></b><span data-t="case.1.role"></span></div></div>
  <div class="nums">
    <div><b data-t="case.1.s1.n"></b><span data-t="case.1.s1.l"></span></div>
    <div><b data-t="case.1.s2.n"></b><span data-t="case.1.s2.l"></span></div>
    <div><b data-t="case.1.s3.n"></b><span data-t="case.1.s3.l"></span></div>
    <div class="sc"><i data-t="case.2.name"></i><b data-t="case.2.n"></b><span data-t="case.2.l"></span></div>
  </div>
  <h3 style="margin-top:90px;font-size:32px" data-t="rep.title"></h3>
  <p style="margin-top:10px;color:var(--soft)" data-t="rep.sub"></p>
  <div class="cards" data-replies><template><div class="card"><span class="tag" data-rep-tag></span><p data-rep-body></p></div></template></div>
</div></section>

<section class="team" style="padding-top:20px"><div class="wrap">
  <h2 class="kick" data-t="team.title"></h2>
  <div class="row">
    <div class="person"><div class="ph"><img src="../shared/assets/noam.webp" alt="Noam Sol"></div><div><b>Noam Sol</b><p data-t="team.noam.role"></p></div></div>
    <div class="person"><div class="ph"><img src="../shared/assets/niv.webp" alt="Niv Altmark"></div><div><b>Niv Altmark</b><p data-t="team.niv.role"></p></div></div>
  </div>
</div></section>

<section class="fit" style="padding-top:20px"><div class="wrap">
  <h2 class="kick" data-t="fit.title"></h2>
  <div class="row">
    <div class="yes"><h3 data-t="fit.yes"></h3><ul data-t-list="fit.yes.items"></ul></div>
    <div class="no"><h3 data-t="fit.no"></h3><ul data-t-list="fit.no.items"></ul></div>
  </div>
</div></section>

<section class="faq" id="faq" style="padding-top:20px"><div class="narrow">
  <h2 class="kick" data-t="faq.title"></h2>
  <div class="list">
    <details><summary data-t="faq.1.q"></summary><p data-t="faq.1.a"></p></details>
    <details><summary data-t="faq.2.q"></summary><p data-t="faq.2.a"></p></details>
    <details><summary data-t="faq.3.q"></summary><p data-t="faq.3.a"></p></details>
    <details><summary data-t="faq.4.q"></summary><p data-t="faq.4.a"></p></details>
    <details><summary data-t="faq.5.q"></summary><p data-t="faq.5.a"></p></details>
    <details><summary data-t="faq.6.q"></summary><p data-t="faq.6.a"></p></details>
  </div>
</div></section>

<section class="close"><div class="wrap">
  <h2 data-t="close.title"></h2>
  <p data-t="close.body"></p>
  <a class="btn" data-book data-t="cta.book"></a>
</div></section>
</main>
<footer><div class="wrap"><img src="../shared/assets/logo-white.png" alt="LeadBound"><span>© 2026 LeadBound.</span><span data-t="foot.line"></span></div></footer>

<script src="../shared/copy.js"></script>
<script>
/* The calendar: weeks 1-2 setup, then meetings appear as each week scrolls into view.
   An illustration (labelled on the page), not a promise. */
(function(){
  var plan=[[],[],[[1,'Seed','DevTools']],[[0,'Series A','Cyber'],[3,'Seed','AI']],[[1,'Seed','Fintech'],[2,'Series A','Data'],[4,'Seed','HR tech']],[[0,'Seed','AI'],[2,'Series A','Security'],[3,'Seed','Legal tech']],[[0,'Series A','Cyber'],[1,'Seed','DevTools'],[3,'Series A','Health'],[4,'Seed','AI']],[[0,'Seed','Data'],[1,'Series A','Fintech'],[3,'Series A','AI'],[4,'Seed','Cyber']]];
  function render(lang){
    var d=LB_COPY[lang]||LB_COPY.en, s=document.getElementById('sheet'), h='<div class="crow head"><div></div>'+d['b.cal.days'].map(function(x){return'<div>'+x+'</div>'}).join('')+'</div>';
    plan.forEach(function(w,i){
      var phase=i<2?d['b.cal.setup']:i<4?d['b.cal.launch']:d['b.cal.scale'];
      h+='<div class="crow'+(i<2?' setup':'')+'" data-w="'+i+'"><div class="wk">'+d['b.cal.week']+' '+(i+1)+(i===0||i===2||i===4?'<small>'+phase+'</small>':'')+'</div>';
      for(var c=0;c<5;c++){var m=w.filter(function(x){return x[0]===c})[0];h+='<div class="cell">'+(m?'<div class="mt" style="transition-delay:'+(c*.08)+'s">'+m[1]+'<span>'+m[2]+'</span></div>':'')+'</div>'}
      h+='</div>';
    });
    s.innerHTML=h;
    var rows=s.querySelectorAll('.crow[data-w]');
    if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){rows.forEach(function(r){r.classList.add('on')});return}
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}})},{rootMargin:'0px 0px -18% 0px'});
    rows.forEach(function(r){io.observe(r)});
  }
  document.addEventListener('lb:lang',function(e){render(e.detail)});
})();
</script>
