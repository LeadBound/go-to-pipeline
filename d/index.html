<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LeadBound | Outbound for funded B2B tech startups</title>
<meta name="description" content="">
<link rel="icon" href="../shared/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 60-30-10: 60 = --bg (background) · 30 = --ink + white cards (structure) · 10 = --accent, ONLY on things you click */
:root{
  --bg:#F4F7F8; --card:#FFFFFF; --ink:#0B1B22; --ink-2:#33454E; --mute:#6B7D86; --line:#DDE5E8; --ink-card:#0E1E25;
  --accent:#12B7D4; --accent-h:#33C7E0;
  --f:"Heebo",system-ui,sans-serif; --lift:0 18px 40px -16px rgba(11,27,34,.35),0 2px 6px rgba(11,27,34,.08);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--f);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block} a{color:inherit} p{margin:0}
h1,h2,h3{margin:0;line-height:1.06;letter-spacing:-.025em;font-weight:800}
html[lang=he] h1,html[lang=he] h2,html[lang=he] h3{letter-spacing:0;line-height:1.14}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:24px}
/* the only accent: buttons */
.cta{display:inline-block;background:var(--accent);color:var(--ink);font-weight:700;text-decoration:none;padding:16px 28px;border-radius:12px;font-size:17px;white-space:nowrap;border:0;cursor:pointer;transition:background .15s}
.cta:hover{background:var(--accent-h)}
.cta.front{box-shadow:var(--lift)}
.cta.sm{padding:10px 18px;font-size:15px}
.ghost{background:none;border:1.5px solid var(--line);color:var(--ink-2);font:inherit;font-size:14px;font-weight:500;padding:7px 12px;border-radius:10px;cursor:pointer}
.ghost:hover{border-color:var(--ink-2)}

nav.top{padding:20px 0}
nav.top .wrap{display:flex;align-items:center;gap:14px}
nav.top img{height:21px;width:auto;margin-inline-end:auto}
nav.top .links{display:flex;gap:22px;font-size:15px;color:var(--ink-2);margin-inline-end:10px}
nav.top .links a{text-decoration:none} nav.top .links a:hover{color:var(--ink)}
@media (max-width:900px){nav.top .links{display:none}}
@media (max-width:480px){nav.top .motion{display:none}}

/* hero: back (inbox) · middle (words) · front (button + booked card) */
.hero{position:relative;padding:40px 0 120px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.who{font-size:17px;font-weight:600;color:var(--ink-2)}
.hero h1{margin-top:16px;font-size:clamp(40px,4.7vw,66px)}
html[lang=he] .hero h1{font-size:clamp(38px,4.5vw,62px)}
.hero .sub{margin-top:22px;font-size:21px;color:var(--ink-2);max-width:36ch}
.hero .act{margin-top:34px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero .note{font-size:15px;color:var(--mute);max-width:28ch}
.stage{position:relative;min-height:470px}
.inbox{position:absolute;inset:0 0 40px 30px;background:var(--ink-card);border-radius:22px;padding:22px;transform:rotate(-2deg);overflow:hidden}
html[dir=rtl] .inbox{inset:0 30px 40px 0;transform:rotate(2deg)}
.inbox h4{margin:0 0 14px;color:#8FA3AD;font-size:13px;font-weight:600}
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:#16282F;border-radius:12px;padding:12px 14px;color:#DDE7EA;font-size:14px;line-height:1.45;direction:ltr;text-align:left}
.row b{display:block;font-size:12px;color:#8FA3AD;font-weight:500;margin-bottom:3px}
.row.new{animation:slide .6s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.booked{position:absolute;inset-inline-start:0;bottom:-70px;width:min(330px,88%);background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--lift);z-index:3}
.booked small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.booked strong{display:block;font-size:24px;margin-top:2px}
.booked span{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.booked i{position:absolute;inset-inline-end:18px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
html.still .row.new{animation:none}
@media (prefers-reduced-motion:reduce){.row.new{animation:none}}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.stage{min-height:380px;margin-top:10px}.inbox{inset:0 0 40px 10px}html[dir=rtl] .inbox{inset:0 10px 40px 0}.booked{bottom:-60px}}

.logos{padding:110px 0 36px;border-bottom:1px solid var(--line)}
.logos .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px 44px}
.logos p{flex-basis:100%;font-size:15px;color:var(--mute);font-weight:500}
.logos img{height:25px;width:auto;filter:brightness(0);opacity:.75}
.logos img.tall{height:38px}
.logos .wm{font-weight:800;font-size:20px;opacity:.75}

section{padding:100px 0}
.h2{font-size:clamp(34px,4.2vw,54px);max-width:20ch}
.lead{margin-top:14px;font-size:19px;color:var(--ink-2);max-width:56ch}

/* free sample: the calculator */
.calc .box{margin-top:40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);background:var(--card);border-radius:24px;border:1px solid var(--line);overflow:hidden}
.calc .in{padding:34px;display:grid;gap:26px;min-width:0}
.field{min-width:0}
.field label{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:16px}
.field label output{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.field input[type=range]{width:100%;margin-top:12px;accent-color:var(--ink);height:6px}
.calc .out{background:var(--ink-card);color:#EAF0F3;padding:34px;display:flex;flex-direction:column}
.calc .out p{color:#9FB2BB;font-size:16px}
.calc .big{margin-top:10px;font-size:84px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.calc .lbl{font-size:18px;font-weight:600}
.calc .wk{margin-top:6px;color:#9FB2BB}
.calc .deals{margin-top:22px;padding-top:18px;border-top:1px solid #23363E;color:#C9D6DB}
.calc .deals b{font-size:28px;color:#fff;margin-inline-end:8px}
.calc .out .cta{margin-top:auto;align-self:flex-start;white-space:normal;max-width:100%;text-align:center}
.calc .fine{margin-top:12px;font-size:14px;color:var(--mute)}
@media (max-width:860px){.calc .box{grid-template-columns:minmax(0,1fr)}.calc .in,.calc .out{padding:24px}.calc .big{font-size:64px}.calc .out .cta{margin-top:24px}}

/* how */
.steps{margin:44px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.steps .n{font-weight:800;font-size:15px;color:var(--mute)}
.steps h3{margin-top:10px;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.steps p{margin-top:8px;font-size:15px;color:var(--ink-2)}
@media (max-width:1000px){.steps{grid-template-columns:1fr 1fr}} @media (max-width:600px){.steps{grid-template-columns:1fr}}

.stats{border-block:1px solid var(--line);padding:44px 0}
.stats .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.stats b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
html[dir=rtl] .stats b{direction:ltr;text-align:right}
.stats span{display:block;margin-top:8px;font-size:14px;color:var(--ink-2)}
@media (max-width:860px){.stats .wrap{grid-template-columns:1fr 1fr}}

/* packages: structure in ink/white, accent only on the buttons */
.pk{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.p{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column}
.p.main{background:var(--ink-card);color:#EAF0F3;border-color:var(--ink-card)}
.p h3{font-size:24px} .p .tag{margin-top:8px;color:var(--ink-2);font-size:16px} .p.main .tag{color:#9FB2BB}
.p ul{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:9px;font-size:15.5px}
.p li{padding-inline-start:24px;position:relative}
.p li::before{content:"";position:absolute;inset-inline-start:0;top:9px;width:12px;height:7px;border-inline-start:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);opacity:.8}
html[dir=rtl] .p li::before{transform:rotate(45deg) scaleX(-1)}
.p .best{margin-top:18px;font-size:14px;color:var(--mute)} .p.main .best{color:#9FB2BB}
.p .cta{margin-top:auto;align-self:flex-start} .p .sp{flex:1;min-height:22px}
.pknote{margin-top:16px;color:var(--mute);font-size:15px}
@media (max-width:900px){.pk{grid-template-columns:1fr}}

.proof .row2{margin-top:44px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px}
.q blockquote{margin:0;font-size:22px;line-height:1.5;font-weight:500}
.q .who2{margin-top:22px;display:flex;align-items:center;gap:12px}
.q .who2 img{width:52px;height:52px;border-radius:50%}
.q .who2 b{display:block} .q .who2 span{font-size:14px;color:var(--ink-2)}
.q .nums{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q .nums b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
html[dir=rtl] .q .nums b{direction:ltr;text-align:right}
.q .nums span{display:block;margin-top:6px;font-size:14px;color:var(--ink-2)}
.q.sc{background:var(--ink-card);color:#EAF0F3;border-color:var(--ink-card);display:flex;flex-direction:column}
.q.sc .wm{font-weight:800;font-size:26px} .q.sc p{margin-top:10px;color:#9FB2BB}
.q.sc .x{margin-top:auto;padding-top:30px} .q.sc .x b{display:block;font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
html[dir=rtl] .q.sc .x b{direction:ltr;text-align:right}
.q.sc .x span{color:#9FB2BB}
@media (max-width:860px){.proof .row2{grid-template-columns:minmax(0,1fr)}.q{padding:24px}.q .nums b{font-size:26px}}

.fit .row2{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px}
.fb h3{font-size:22px} .fb ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.fb li{padding-inline-start:26px;position:relative}
.fb.y li::before{content:"";position:absolute;inset-inline-start:0;top:10px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.fb.n li{color:var(--ink-2)} .fb.n li::before{content:"";position:absolute;inset-inline-start:1px;top:15px;width:10px;height:2px;background:var(--mute)}
@media (max-width:700px){.fit .row2{grid-template-columns:1fr}}

.faq .list{margin-top:36px;max-width:820px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:800}
.faq details[open] summary::after{content:"−"}
.faq details p{padding-bottom:20px;color:var(--ink-2)}

.close{background:var(--ink-card);color:#EAF0F3;text-align:center;padding:120px 0}
.close h2{font-size:clamp(38px,5.4vw,72px)}
.close p{margin:18px auto 0;max-width:44ch;color:#9FB2BB}
.close .cta{margin-top:32px}
footer{background:var(--ink-card);color:#6F8792;font-size:14px;padding:0 0 30px}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:1px solid #1F333B;padding-top:24px}
footer img{height:17px;width:auto;opacity:.85}
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <img src="../shared/assets/logo-black.png" alt="LeadBound">
  <div class="links"><a href="#calc" data-t="d.calc.title"></a><a href="#packages" data-t="nav.packages"></a><a href="#faq" data-t="nav.faq"></a></div>
  <button class="ghost motion" id="motion" type="button"></button>
  <button class="ghost" data-lang-toggle data-t="lang.toggle"></button>
  <a class="cta sm" data-book data-t="cta.short"></a>
</div></nav>

<main>
<header class="hero">
  <div class="wrap">
    <div>
      <p class="who" data-t="d.who"></p>
      <h1 data-t="d.hero.title"></h1>
      <p class="sub" data-t="d.hero.sub"></p>
      <div class="act"><a class="cta front" data-book data-t="cta.book"></a><span class="note" data-t="cta.note"></span></div>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="inbox"><h4 data-t="d.inbox"></h4><div class="rows" id="rows"></div></div>
      <div class="booked"><i></i><small data-t="d.booked"></small><strong data-t="d.booked.when"></strong><span data-t="d.booked.with"></span></div>
    </div>
  </div>
</header>

<div class="logos"><div class="wrap">
  <p data-t="logos.label"></p>
  <img src="../shared/assets/agentic-dark.svg" alt="Agentic-Dev">
  <img src="../shared/assets/controla.webp" alt="Controla">
  <span class="wm">Scoutech</span>
  <img src="../shared/assets/deeplan.webp" alt="Deeplan">
  <span class="wm">Brightmerge</span>
  <img class="tall" src="../shared/assets/falconies.webp" alt="Falconies">
  <span class="wm">Dex World</span>
</div></div>

<section class="calc" id="calc"><div class="wrap">
  <h2 class="h2" data-t="d.calc.title"></h2>
  <p class="lead" data-t="d.calc.sub"></p>
  <div class="box">
    <div class="in">
      <div class="field"><label for="t"><span data-t="d.calc.target"></span><output id="to"></output></label><input id="t" type="range" min="100000" max="5000000" step="50000" value="600000"></div>
      <div class="field"><label for="d"><span data-t="d.calc.deal"></span><output id="do"></output></label><input id="d" type="range" min="5000" max="250000" step="5000" value="30000"></div>
      <div class="field"><label for="c"><span data-t="d.calc.close"></span><output id="co"></output></label><input id="c" type="range" min="5" max="60" step="1" value="20"></div>
    </div>
    <div class="out" aria-live="polite">
      <p data-t="d.calc.result"></p>
      <div class="big" id="mm"></div>
      <div class="lbl" data-t="d.calc.meetings"></div>
      <div class="wk" id="wk"></div>
      <div class="deals"><b id="dd"></b><span data-t="d.calc.deals"></span></div>
      <a class="cta" data-book data-t="d.calc.cta" style="margin-top:28px"></a>
    </div>
  </div>
</div></section>

<section class="how" id="how" style="padding-top:20px"><div class="wrap">
  <h2 class="h2" data-t="how.title"></h2>
  <ol class="steps">
    <li><div class="n">1</div><h3 data-t="how.1.t"></h3><p data-t="how.1.b"></p></li>
    <li><div class="n">2</div><h3 data-t="how.2.t"></h3><p data-t="how.2.b"></p></li>
    <li><div class="n">3</div><h3 data-t="how.3.t"></h3><p data-t="how.3.b"></p></li>
    <li><div class="n">4</div><h3 data-t="how.4.t"></h3><p data-t="how.4.b"></p></li>
    <li><div class="n">5</div><h3 data-t="how.5.t"></h3><p data-t="how.5.b"></p></li>
  </ol>
</div></section>

<div class="stats"><div class="wrap">
  <div><b data-t="stat.1.n"></b><span data-t="stat.1.l"></span></div>
  <div><b data-t="stat.2.n"></b><span data-t="stat.2.l"></span></div>
  <div><b data-t="stat.3.n"></b><span data-t="stat.3.l"></span></div>
  <div><b data-t="stat.4.n"></b><span data-t="stat.4.l"></span></div>
  <div><b data-t="stat.5.n"></b><span data-t="stat.5.l"></span></div>
</div></div>

<section id="packages"><div class="wrap">
  <h2 class="h2" data-t="pk.title"></h2>
  <p class="lead" data-t="pk.sub"></p>
  <div class="pk">
    <div class="p main"><h3 data-t="pk.1.name"></h3><p class="tag" data-t="pk.1.tag"></p><ul data-t-list="pk.1.items"></ul><p class="best" data-t="pk.1.best"></p><div class="sp"></div><a class="cta" data-book data-t="cta.short"></a></div>
    <div class="p"><h3 data-t="pk.2.name"></h3><p class="tag" data-t="pk.2.tag"></p><ul data-t-list="pk.2.items"></ul><p class="best" data-t="pk.2.best"></p><div class="sp"></div><a class="cta" data-book data-t="cta.short"></a></div>
    <div class="p"><h3 data-t="pk.3.name"></h3><p class="tag" data-t="pk.3.tag"></p><ul data-t-list="pk.3.items"></ul><p class="best" data-t="pk.3.best"></p><div class="sp"></div><a class="cta" data-book data-t="cta.short"></a></div>
  </div>
  <p class="pknote" data-t="pk.note"></p>
</div></section>

<section class="proof" id="results" style="padding-top:20px"><div class="wrap">
  <h2 class="h2" data-t="case.title"></h2>
  <div class="row2">
    <article class="q">
      <blockquote data-t="case.1.quote"></blockquote>
      <div class="who2"><img src="../shared/assets/elad.webp" alt=""><div><b data-t="case.1.name"></b><span data-t="case.1.role"></span></div></div>
      <div class="nums">
        <div><b data-t="case.1.s1.n"></b><span data-t="case.1.s1.l"></span></div>
        <div><b data-t="case.1.s2.n"></b><span data-t="case.1.s2.l"></span></div>
        <div><b data-t="case.1.s3.n"></b><span data-t="case.1.s3.l"></span></div>
      </div>
    </article>
    <article class="q sc"><div class="wm" data-t="case.2.name"></div><p data-t="case.2.desc"></p><div class="x"><b data-t="case.2.n"></b><span data-t="case.2.l"></span></div></article>
  </div>
</div></section>

<section class="fit" style="padding-top:20px"><div class="wrap">
  <h2 class="h2" data-t="fit.title"></h2>
  <div class="row2">
    <div class="fb y"><h3 data-t="fit.yes"></h3><ul data-t-list="fit.yes.items"></ul></div>
    <div class="fb n"><h3 data-t="fit.no"></h3><ul data-t-list="fit.no.items"></ul></div>
  </div>
</div></section>

<section class="faq" id="faq" style="padding-top:20px"><div class="wrap">
  <h2 class="h2" data-t="faq.title"></h2>
  <div class="list">
    <details><summary data-t="faq.1.q"></summary><p data-t="faq.1.a"></p></details>
    <details><summary data-t="faq.2.q"></summary><p data-t="faq.2.a"></p></details>
    <details><summary data-t="faq.3.q"></summary><p data-t="faq.3.a"></p></details>
    <details><summary data-t="faq.4.q"></summary><p data-t="faq.4.a"></p></details>
    <details><summary data-t="faq.5.q"></summary><p data-t="faq.5.a"></p></details>
    <details><summary data-t="faq.6.q"></summary><p data-t="faq.6.a"></p></details>
  </div>
</div></section>

<section class="close"><div class="wrap">
  <h2 data-t="close.title"></h2>
  <p data-t="close.body"></p>
  <a class="cta front" data-book data-t="cta.book"></a>
</div></section>
</main>
<footer><div class="wrap"><img src="../shared/assets/logo-white.png" alt="LeadBound"><span>© 2026 LeadBound.</span><span data-t="foot.line"></span></div></footer>

<script src="../shared/copy.js"></script>
<script>
(function(){
  var lang='en', root=document.documentElement, KEY='lb-gtp-motion';
  /* motion: off when the OS asks for reduced motion, or when the visitor switches it off */
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{var m=localStorage.getItem(KEY);if(m)still=m==='off'}catch(e){}
  function setMotion(){root.classList.toggle('still',still);var d=LB_COPY[lang]||LB_COPY.en;document.getElementById('motion').textContent=still?d['d.motion.on']:d['d.motion.off']}

  /* the one moving thing: real replies arriving in the inbox */
  var R=window.LB_REPLIES, i=0, rows;
  function row(k,isNew){var d=LB_COPY[lang]||LB_COPY.en,el=document.createElement('div');el.className='row'+(isNew?' new':'');
    el.innerHTML='<b></b>';el.querySelector('b').textContent=d['rep.'+(k+1)+'.tag'];el.appendChild(document.createTextNode(R[k].length>150?R[k].slice(0,147)+'…':R[k]));return el}
  function fill(){rows=document.getElementById('rows');rows.innerHTML='';for(var k=0;k<4;k++)rows.appendChild(row((i+k)%R.length,false))}
  setInterval(function(){if(still||document.hidden||!rows)return;i=(i+R.length-1)%R.length;rows.insertBefore(row(i,true),rows.firstChild);if(rows.children.length>5)rows.removeChild(rows.lastChild)},3800);

  /* free sample: the meetings calculator, on the visitor's own numbers */
  function money(n){return '$'+(n>=1e6?(n/1e6).toFixed(n%1e6?1:0)+'M':Math.round(n/1e3)+'K')}
  function calc(){
    var t=+document.getElementById('t').value,d=+document.getElementById('d').value,c=+document.getElementById('c').value,L=LB_COPY[lang]||LB_COPY.en;
    document.getElementById('to').textContent=money(t);document.getElementById('do').textContent=money(d);document.getElementById('co').textContent=c+'%';
    var deals=Math.ceil(t/d), meetings=Math.ceil(deals/(c/100)/12), week=Math.max(1,Math.round(meetings/4.3));
    document.getElementById('dd').textContent=deals;document.getElementById('mm').textContent=meetings;
    document.getElementById('wk').textContent=L['d.calc.week'].replace('{n}',week);
  }
  document.addEventListener('lb:lang',function(e){lang=e.detail;fill();calc();setMotion()});
  document.addEventListener('DOMContentLoaded',function(){
    ['t','d','c'].forEach(function(id){document.getElementById(id).addEventListener('input',calc)});
    document.getElementById('motion').addEventListener('click',function(){still=!still;try{localStorage.setItem(KEY,still?'off':'on')}catch(e){}setMotion()});
  });
})();
</script>
<script src="../shared/i18n.js"></script>
</body>
